name: build

# The 50,000-character Webflow Embed cap is the one limit that breaks this
# silently — Webflow truncates rather than erroring. build.js exits non-zero
# when the output crosses it, so CI is the backstop on every PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build (fails if the embed exceeds 50,000 chars)
        run: node build.js

      - name: Built JavaScript must parse
        run: |
          node -e "
            const fs = require('fs');
            const js = fs.readFileSync('webflow/embed.html','utf8')
              .match(/<script>([\s\S]*?)<\/script>/)[1];
            fs.writeFileSync('/tmp/embed.js', js);
          "
          node --check /tmp/embed.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test (34 checks, desktop + mobile)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: No API key may reach the repo, except the committed embed
        run: |
          # webflow/embed.html is committed on purpose, live key and all, so the
          # paste-ready file ships in the repo. That is only acceptable while
          # this repo is private. Everything else must stay clean - above all
          # src/webflow-embed.html, which is where a stray paste would land.
          #
          # -l lists filenames: a match inside the minified embed would
          # otherwise dump 47,000 characters into the log. The sed normalises
          # grep's leading "./", which GNU grep emits and BSD grep does not.
          HITS=$(grep -rIl --exclude-dir=.git --exclude-dir=node_modules \
                   --exclude=build.yml -E "AIza[0-9A-Za-z_-]{35}" . \
                 | sed 's|^\./||' \
                 | grep -vx 'webflow/embed.html' || true)
          if [ -n "$HITS" ]; then
            echo "Files containing a Google API key:"
            echo "$HITS"
            echo "::error::A Google API key is present outside webflow/embed.html. Keys belong in config.local.json."
            exit 1
          fi
          echo "clean"
