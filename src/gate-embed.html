<!--
  ============================================================================
  UPSERVE — CONTENT GATE  (Webflow custom-code embed)
  ----------------------------------------------------------------------------
  Readable source. Run `node build.js` and paste webflow/gate-embed.html
  (or `npm run copy:gate`), never this file.

  One embed for every gated content asset (calculators, guides, reports).
  Five fields: first name, last name, work email, phone, restaurant or group.
  No scheduler, no triage: these are top-of-funnel leads, so the form asks for
  as little as it can and then gets out of the way.

  The page says which asset it is, with attributes on any wrapper above the
  Embed element (nearest ancestor wins):

    data-upserve-asset="Guest Value Calculator"     required: the asset name
    data-upserve-gate-id="guest-value-calc-gate"    the form's HTML id
    data-upserve-gate-button="Get my results"       button text (optional)

  Every asset posts to the ONE "Content asset" form in Default (CFG.FORM_ID),
  so a new asset needs no setup in Default: its name arrives as
  `content_asset` and its id as `content_asset_id`.

  On submit it unlocks: shows a short thank-you and fires
    document  'upserve:gate-unlocked'  { detail: { asset, id } }
  for the page to reveal the content. A page can attach extra context to the
  lead (the calculator's numbers, say) by setting window.usvGateDetails to a
  string or a function that returns one; it is sent as `asset_details`.

  It never registers Default submission callbacks. Default holds one set per
  page, and the demo form on the same page needs them for its scheduler.

  Anti-spam: honeypot + submit-speed floor. A trap still unlocks the content
  (the visitor might be human) but never reaches Default.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">

<style>
/* Tokens and field rules are the demo form's, scoped to this root. No card
   and no headline: the page's own modal or section owns the copy. */
#usv-gate{
  --usv-yellow:#ffcd04;
  --usv-black:#000000;
  --usv-ink:#000000;
  --usv-ink-2:#474747;
  --usv-line:#ddd8d1;
  --usv-paper:#ffffff;
  --usv-error:#b3261e;
  --usv-sans:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;

  position:relative;
  font-family:var(--usv-sans);
  color:var(--usv-ink);
  -webkit-font-smoothing:antialiased;
  box-sizing:border-box;
  /* Webflow's Embed wrapper is a flex container; without min-width:0 the form
     floors at its min-content width and pushes the page sideways. */
  width:100%;max-width:100%;min-width:0;
}
#usv-gate *,#usv-gate *::before,#usv-gate *::after{box-sizing:border-box;}
#usv-gate svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}

/* --- fields --------------------------------------------------------------- */
#usv-gate .usv-field{margin:0 0 14px;position:relative;}
/* Stacks on the space the row has, not the viewport: a modal is narrow. */
#usv-gate .usv-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));
  column-gap:12px;align-items:start;
}
#usv-gate .usv-label{
  display:block;
  font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--usv-ink);margin:0 0 7px;
}
#usv-gate .usv-input{
  width:100%;margin:0;
  font-family:var(--usv-sans);
  font-size:16px;           /* 16px = no iOS zoom-on-focus */
  line-height:1.4;color:var(--usv-ink);
  background:var(--usv-paper);
  border:1.5px solid var(--usv-line);border-radius:8px;
  padding:13px 14px;outline:none;height:auto;
  appearance:none;-webkit-appearance:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
#usv-gate .usv-input::placeholder{color:#a8a29a;}
#usv-gate .usv-input:hover{border-color:#c3bcb2;}
#usv-gate .usv-input:focus{border-color:var(--usv-ink);box-shadow:0 0 0 3px rgba(255,205,4,.42);}
#usv-gate .usv-err{
  display:none;font-size:13px;line-height:1.45;color:var(--usv-error);font-weight:700;margin:7px 0 0;
}
#usv-gate .usv-field.is-invalid .usv-err{display:block;}
#usv-gate .usv-field.is-invalid .usv-input{border-color:var(--usv-error);}

/* --- typo rescue ---------------------------------------------------------- */
#usv-gate .usv-typo{
  display:none;align-items:center;gap:6px 7px;flex-wrap:wrap;
  margin:9px 0 0;font-size:13.5px;color:var(--usv-ink-2);
}
#usv-gate .usv-typo.is-on{display:flex;}
#usv-gate .usv-typo-btn,#usv-gate .usv-typo-no{
  position:relative;font-family:var(--usv-sans);cursor:pointer;
}
#usv-gate .usv-typo-btn{
  font-size:13.5px;font-weight:700;color:var(--usv-ink);background:var(--usv-yellow);
  border:0;border-radius:5px;padding:4px 9px;
}
#usv-gate .usv-typo-no{
  font-size:13px;color:var(--usv-ink-2);background:none;border:0;padding:2px 0;
  text-decoration:underline;text-underline-offset:3px;
}
#usv-gate .usv-typo-no::after,#usv-gate .usv-typo-btn::after{content:"";position:absolute;inset:-11px -3px;}

/* --- button --------------------------------------------------------------- */
#usv-gate .usv-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
  margin-top:6px;
  font-family:var(--usv-sans);font-size:16px;font-weight:700;letter-spacing:.01em;
  color:var(--usv-black);background:var(--usv-yellow);
  border:1.5px solid var(--usv-black);border-radius:8px;
  padding:15px 22px;cursor:pointer;
  transition:transform .12s ease,filter .15s ease,box-shadow .15s ease;
  box-shadow:0 2px 0 0 var(--usv-black);
}
#usv-gate .usv-btn:hover{filter:brightness(.96);}
#usv-gate .usv-btn:active{transform:translateY(2px);box-shadow:none;}
#usv-gate .usv-btn:focus-visible{outline:3px solid rgba(20,19,18,.4);outline-offset:2px;}
#usv-gate .usv-btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none;}

/* --- done ----------------------------------------------------------------- */
#usv-gate .usv-done{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:700;line-height:1.4;}
#usv-gate .usv-done[hidden]{display:none;}
#usv-gate .usv-done-mark{
  flex:0 0 36px;width:36px;height:36px;border-radius:50%;
  background:var(--usv-yellow);color:var(--usv-black);
  display:flex;align-items:center;justify-content:center;
}

/* --- honeypot + screen-reader text ---------------------------------------- */
#usv-gate .usv-hp{
  position:absolute !important;left:-9999px !important;top:auto !important;
  width:1px !important;height:1px !important;overflow:hidden !important;
  opacity:0 !important;pointer-events:none !important;
}
#usv-gate .usv-sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

@media (prefers-reduced-motion:reduce){
  #usv-gate *{transition-duration:.001ms !important;}
}
</style>


<div id="usv-gate">
  <form id="usv-gate-form" novalidate autocomplete="on">
    <!-- honeypot. Humans never see or focus these. -->
    <div class="usv-hp" aria-hidden="true">
      <label for="usv-hp-url">Company website</label>
      <input type="text" id="usv-hp-url" name="company_website_confirm" tabindex="-1" autocomplete="off">
      <label for="usv-hp-t">Time on page</label>
      <input type="text" id="usv-hp-t" name="form_render_time" tabindex="-1" autocomplete="off">
    </div>

    <div class="usv-row">
      <div class="usv-field" id="usv-f-first">
        <label class="usv-label" for="usv-first">First name</label>
        <input class="usv-input" id="usv-first" name="first_name" type="text"
               autocomplete="given-name" placeholder="Alex">
        <p class="usv-err">First name is required.</p>
      </div>
      <div class="usv-field" id="usv-f-last">
        <label class="usv-label" for="usv-last">Last name</label>
        <input class="usv-input" id="usv-last" name="last_name" type="text"
               autocomplete="family-name" placeholder="Rivera">
        <p class="usv-err">Last name is required.</p>
      </div>
    </div>

    <div class="usv-field" id="usv-f-email">
      <label class="usv-label" for="usv-email">Work email</label>
      <input class="usv-input" id="usv-email" name="email" type="email"
             autocomplete="email" inputmode="email" spellcheck="false"
             autocapitalize="off" placeholder="you@restaurantgroup.com">
      <div class="usv-typo" id="usv-typo">
        <span>Did you mean <strong id="usv-typo-txt"></strong>?</span>
        <button type="button" class="usv-typo-btn" id="usv-typo-yes">Use it</button>
        <button type="button" class="usv-typo-no" id="usv-typo-no">No, it&rsquo;s right</button>
      </div>
      <p class="usv-err">Enter an email we can actually reach.</p>
    </div>

    <div class="usv-field" id="usv-f-phone">
      <label class="usv-label" for="usv-phone">Phone</label>
      <input class="usv-input" id="usv-phone" name="phone" type="tel"
             autocomplete="tel" inputmode="tel" placeholder="(555) 555-5555">
      <p class="usv-err">Enter a valid phone number.</p>
    </div>

    <div class="usv-field" id="usv-f-biz">
      <label class="usv-label" for="usv-biz">Restaurant or group</label>
      <input class="usv-input" id="usv-biz" name="restaurant_name" type="text"
             autocomplete="organization" autocapitalize="words" placeholder="e.g. Harbor Hospitality Group">
      <p class="usv-err">Restaurant or group is required.</p>
    </div>

    <button type="submit" class="usv-btn" id="usv-submit">Get it now</button>
  </form>

  <div class="usv-done" id="usv-done" aria-live="polite" hidden>
    <span class="usv-done-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 22 22"><path d="M4.5 11.4 9 15.9 17.5 6.5" stroke-width="2.6"/></svg>
    </span>
    <span id="usv-done-txt">You&rsquo;re all set.</span>
  </div>

  <p class="usv-sr" id="usv-live" role="status" aria-live="polite"></p>
</div>


<script>
(function () {
  'use strict';

  var CFG = {
    /* The one "Content asset" form in Default. Every asset posts here; the
       asset itself travels as content_asset. Stamped on the form as
       data-default-form-id, which the SDK treats as authoritative over the
       page-level snippet. null = not stamped (the page snippet's form wins). */
    FORM_ID : null,
    TEAM_ID : 743,

    /* Sent on every submission. The CRM's own spellings. A page can override
       lead_source with data-upserve-lead-source, same as the other forms. */
    LEAD_SOURCE        : 'Inbound',
    LEAD_STATUS_REASON : 'Creation',
    COUNTRY            : 'US',

    MIN_SUBMIT_SECONDS : 3,
    /* Unlock this long after the submit goes through to Default. There is no
       scheduler to wait for, and Default's post carries on regardless. */
    UNLOCK_MS : 700,

    /* Labels Default shows for the hidden fields (it reads aria-label). */
    FIELDS : {
      form_type          : 'Form type',
      content_asset      : 'Content asset',
      content_asset_id   : 'Content asset form ID',
      asset_details      : 'Asset details',
      lead_source        : 'Lead source',
      lead_status_reason : 'Lead status reason',
      country            : 'Country',
      phone_e164         : 'Phone (E.164)',
      email_domain       : 'Email domain',
      utm_source         : 'UTM source',
      utm_medium         : 'UTM medium',
      utm_campaign       : 'UTM campaign',
      utm_term           : 'UTM term',
      utm_content        : 'UTM content',
      gclid              : 'Google Click ID',
      landing_page       : 'Landing page',
      referrer           : 'Referrer'
    }
  };

  var $  = function (id) { return document.getElementById(id); };
  var on = function (el, ev, fn) { if (el) el.addEventListener(ev, fn); };
  var root = $('usv-gate');
  if (!root || root.dataset.usvBooted === '1') return;
  root.dataset.usvBooted = '1';

  var form = $('usv-gate-form');
  var S = { renderedAt: Date.now(), submitted: false, typoFix: null, typoDismissed: false };

  function txt(el, s) { if (el) el.textContent = s; }
  function say(s) { txt($('usv-live'), s); }

  /* Page settings: nearest ancestor carrying the attribute wins. */
  function attr(name) {
    var host = root.closest('[' + name + ']');
    return host ? (host.getAttribute(name) || '').trim() : '';
  }
  var ASSET    = attr('data-upserve-asset');
  var GATE_ID  = attr('data-upserve-gate-id');
  var LEAD_SRC = attr('data-upserve-lead-source') || CFG.LEAD_SOURCE;
  var BTN      = attr('data-upserve-gate-button');
  if (BTN) txt($('usv-submit'), BTN);
  /* The form's HTML id is what Default shows as the connected form ID, so it
     carries the asset's own id when the page gives one. */
  if (GATE_ID) form.id = GATE_ID;

  /* dataLayer events. Wrapped: analytics must never break a submission. */
  function track(name, extra) {
    try {
      var dl = window.dataLayer || (window.dataLayer = []);
      var p = { event: 'usv_gate_' + name, content_asset: ASSET }, k;
      if (extra) { for (k in extra) if (extra[k] !== '' && extra[k] != null) p[k] = extra[k]; }
      dl.push(p);
    } catch (e) { /* no-op */ }
  }

  on(form, 'input', function (e) {
    if (e.target.classList.contains('usv-input')) clearErr(e.target.closest('.usv-field'));
  });

  /* ---- attribution: first touch persisted, shared with the demo form ------ */
  var UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'];
  function readAttribution() {
    var out = {}, i, k, saved = {};
    var qs = new URLSearchParams(window.location.search);
    try { saved = JSON.parse(window.localStorage.getItem('usv_attr') || '{}'); } catch (e) { /* no-op */ }
    for (i = 0; i < UTM_KEYS.length; i++) {
      k = UTM_KEYS[i];
      out[k] = qs.get(k) || saved[k] || '';
    }
    out.gclid = qs.get('gclid') || qs.get('wbraid') || qs.get('gbraid') || saved.gclid || '';
    out.landing_page = saved.landing_page || window.location.href;
    out.referrer = saved.referrer || document.referrer || '';
    return out;
  }

  /* ---- Default SDK -------------------------------------------------------- */
  (function bootDefault(w, d) {
    var tries = 0;
    w.__default__ = w.__default__ || {};
    if (CFG.FORM_ID) w.__default__.form_id = w.__default__.form_id || CFG.FORM_ID;
    w.__default__.team_id = w.__default__.team_id || CFG.TEAM_ID;
    w.__default__.listenToIds = w.__default__.listenToIds || [];
    if (w.__default__loaded || d.querySelector('script[src^="https://import-cdn.default.com"]')) return;
    (function load() {
      var s = d.createElement('script');
      s.async = true;
      s.src = 'https://import-cdn.default.com';
      s.onerror = function () { if (++tries <= 3) window.setTimeout(load, 1000 * tries); };
      d.head.appendChild(s);
    }());
  }(window, document));

  /* ---- phone -------------------------------------------------------------- */
  var phoneInput = $('usv-phone');
  function digitsOf(v) { return String(v || '').replace(/\D/g, ''); }
  function formatPhone(v) {
    var d = digitsOf(v);
    if (d.charAt(0) === '1' && d.length > 10) d = d.slice(1);
    d = d.slice(0, 10);
    if (d.length <= 3) return d;
    if (d.length <= 6) return '(' + d.slice(0, 3) + ') ' + d.slice(3);
    return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
  }
  on(phoneInput, 'input', function () {
    var raw = phoneInput.value;
    if (raw.charAt(0) === '+' && digitsOf(raw).slice(0, 1) !== '1') return;   // international: leave it
    var pos = phoneInput.selectionStart, before = raw.length;
    phoneInput.value = formatPhone(raw);
    if (pos !== null && pos < before) {
      var at = pos + (phoneInput.value.length - before);
      try { phoneInput.setSelectionRange(at, at); } catch (e) { /* no-op */ }
    }
  });
  function phoneValid(v) {
    var raw = String(v || '').trim(), d = digitsOf(raw);
    if (raw.charAt(0) === '+') return d.length >= 8 && d.length <= 15;
    if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
    if (d.length !== 10 || /^(\d)\1{9}$/.test(d)) return false;
    return !/[01]/.test(d.charAt(0)) && !/[01]/.test(d.charAt(3));
  }
  function phoneE164(v) {
    var raw = String(v || '').trim(), d = digitsOf(raw);
    if (raw.charAt(0) === '+') return '+' + d;
    if (d.length === 10) return '+1' + d;
    if (d.length === 11 && d.charAt(0) === '1') return '+' + d;
    return raw;
  }
  on(phoneInput, 'blur', function () {
    if (phoneInput.value.trim() && !phoneValid(phoneInput.value)) setErr($('usv-f-phone'));
  });

  /* ---- validation --------------------------------------------------------- */
  var EMAIL_RE = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[a-zA-Z]{2,}$/;
  function setErr(f) { if (f) f.classList.add('is-invalid'); }
  function clearErr(f) { if (f) f.classList.remove('is-invalid'); }
  function check(id, ok) { (ok ? clearErr : setErr)($(id)); return ok; }

  function validate() {
    /* every check runs, so all the errors show at once */
    var r = [
      check('usv-f-first', $('usv-first').value.trim().length > 0),
      check('usv-f-last',  $('usv-last').value.trim().length > 0),
      check('usv-f-email', EMAIL_RE.test($('usv-email').value.trim())),
      check('usv-f-phone', phoneValid(phoneInput.value)),
      check('usv-f-biz',   $('usv-biz').value.trim().length > 1)
    ];
    return r.indexOf(false) < 0;
  }
  function focusFirstInvalid() {
    var bad = root.querySelector('.usv-field.is-invalid input');
    if (bad) bad.focus();
  }

  /* =========================================================================
     Email — typo rescue. Suggests, never blocks. Same rules as the demo form.
     ========================================================================= */
  var COMMON_DOMAINS = ('gmail.com yahoo.com hotmail.com outlook.com aol.com icloud.com ' +
    'me.com msn.com live.com comcast.net verizon.net att.net cox.net sbcglobal.net ' +
    'bellsouth.net charter.net earthlink.net ymail.com mac.com protonmail.com ' +
    'proton.me yahoo.ca rogers.com shaw.ca').split(' ');
  var TLDS = 'com net org edu gov co io us ca biz info me'.split(' ');

  function lev(a, b) {
    var m = a.length, n = b.length, i, j, prev, tmp;
    if (!m) return n;
    if (!n) return m;
    var row = new Array(n + 1);
    for (j = 0; j <= n; j++) row[j] = j;
    for (i = 1; i <= m; i++) {
      prev = row[0]; row[0] = i;
      for (j = 1; j <= n; j++) {
        tmp = row[j];
        row[j] = Math.min(row[j] + 1, row[j - 1] + 1,
                          prev + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
        prev = tmp;
      }
    }
    return row[n];
  }

  function suggestEmail(value) {
    var v = String(value || '').trim().toLowerCase();
    var at = v.lastIndexOf('@');
    if (at < 1 || at === v.length - 1) return null;
    var local = v.slice(0, at), domain = v.slice(at + 1);
    if (!domain || domain.indexOf('.') < 0) return null;

    /* 1. doubled TLD: gmail.com.com -> gmail.com */
    var parts = domain.split('.');
    while (parts.length > 2 && parts[parts.length - 1] === parts[parts.length - 2]) parts.pop();
    var fixed = parts.join('.'), i, d;

    /* 2. near-miss on a common consumer domain */
    if (COMMON_DOMAINS.indexOf(fixed) < 0) {
      var best = null, bestD = 99;
      for (i = 0; i < COMMON_DOMAINS.length; i++) {
        d = lev(fixed, COMMON_DOMAINS[i]);
        if (d < bestD) { bestD = d; best = COMMON_DOMAINS[i]; }
      }
      if (best && bestD > 0 && bestD <= (fixed.length <= 6 ? 1 : 2)) fixed = best;
    }

    /* 3. bad TLD on an otherwise fine domain: yourplace.con -> yourplace.com */
    if (COMMON_DOMAINS.indexOf(fixed) < 0) {
      var seg = fixed.split('.'), tld = seg[seg.length - 1];
      if (TLDS.indexOf(tld) < 0) {
        var bt = null, btD = 99;
        for (i = 0; i < TLDS.length; i++) {
          d = lev(tld, TLDS[i]);
          if (d < btD) { btD = d; bt = TLDS[i]; }
        }
        if (bt && btD === 1) { seg[seg.length - 1] = bt; fixed = seg.join('.'); }
      }
    }

    return fixed === domain ? null : local + '@' + fixed;
  }

  var emailInput = $('usv-email'), typoBox = $('usv-typo');

  function showTypo(fix) {
    S.typoFix = fix;
    txt($('usv-typo-txt'), fix);
    typoBox.classList.add('is-on');
    say('Did you mean ' + fix + '?');
  }
  function hideTypo() { S.typoFix = null; typoBox.classList.remove('is-on'); }

  on(emailInput, 'blur', function () {
    var val = emailInput.value.trim();
    if (val === '') return;
    if (!EMAIL_RE.test(val)) { setErr($('usv-f-email')); hideTypo(); return; }
    clearErr($('usv-f-email'));
    if (S.typoDismissed) return;
    var fix = suggestEmail(val);
    if (fix) showTypo(fix); else hideTypo();
  });
  on(emailInput, 'input', function () {
    if (typoBox.classList.contains('is-on')) hideTypo();
    S.typoDismissed = false;
  });
  on($('usv-typo-yes'), 'click', function () {
    if (S.typoFix) emailInput.value = S.typoFix;
    hideTypo();
    S.typoDismissed = true;
    clearErr($('usv-f-email'));
    emailInput.focus();
  });
  on($('usv-typo-no'), 'click', function () {
    hideTypo();
    S.typoDismissed = true;     /* their call — we never block on this */
    emailInput.focus();
  });

  function isBot() {
    if ($('usv-hp-url').value.trim() !== '' || $('usv-hp-t').value.trim() !== '') return 'honeypot';
    if ((Date.now() - S.renderedAt) / 1000 < CFG.MIN_SUBMIT_SECONDS) return 'too_fast';
    return null;
  }

  /* ---- hidden fields ------------------------------------------------------ */
  function addHidden(key, val) {
    var el = document.createElement('input');
    el.type = 'hidden';
    el.name = key;
    el.value = val == null ? '' : String(val);
    el.setAttribute('data-usv-hidden', '1');
    if (CFG.FIELDS[key]) el.setAttribute('aria-label', CFG.FIELDS[key]);
    form.appendChild(el);
  }
  /* What the page wants recorded about this asset (the calculator's numbers).
     A string or a function returning one; a page bug must not stop the lead. */
  function assetDetails() {
    try {
      var d = window.usvGateDetails;
      return String((typeof d === 'function' ? d() : d) || '').slice(0, 30000);
    } catch (e) { return ''; }
  }
  function syncHiddenFields() {
    var old = form.querySelectorAll('[data-usv-hidden]'), i, k;
    for (i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);

    /* The traps have done their job by now. Drop their names so Default
       doesn't receive two junk fields on every real lead. */
    var hp = form.querySelectorAll('.usv-hp input');
    for (i = 0; i < hp.length; i++) hp[i].removeAttribute('name');

    var email = emailInput.value.trim();
    var v = readAttribution();
    v.form_type          = 'content_asset';
    v.content_asset      = ASSET;
    v.content_asset_id   = form.id;
    v.asset_details      = assetDetails();
    v.lead_source        = LEAD_SRC;
    v.lead_status_reason = CFG.LEAD_STATUS_REASON;
    v.country            = CFG.COUNTRY;
    v.phone_e164         = phoneE164(phoneInput.value);
    v.email_domain       = email.slice(email.lastIndexOf('@') + 1).toLowerCase();
    /* Every field on every submission, empty or not: Default learns its
       schema from what arrives. */
    for (k in v) addHidden(k, v[k]);
  }

  /* ---- unlock ------------------------------------------------------------- */
  function unlock() {
    var first = $('usv-first').value.trim();
    txt($('usv-done-txt'), (first ? 'Thanks, ' + first + '. ' : '') + 'You’re all set.');
    form.hidden = true;
    $('usv-done').hidden = false;
    root.classList.add('is-unlocked');
    say('Unlocked.');
    try {
      document.dispatchEvent(new CustomEvent('upserve:gate-unlocked',
        { detail: { asset: ASSET, id: form.id } }));
    } catch (e) { /* no-op */ }
  }

  /* Capture phase on document runs ahead of Default's listener on the form:
     always preventDefault (Default doesn't), stopPropagation only to block. */
  function gate(e) {
    if (e.target !== form) return;
    e.preventDefault();
    if (S.submitted) { e.stopPropagation(); return; }

    if (!validate()) { e.stopPropagation(); focusFirstInvalid(); return; }

    var trap = isBot();
    if (trap) {
      e.stopPropagation();
      S.submitted = true;
      track('blocked', { reason: trap });
      unlock();
      return;
    }

    /* Last chance on the typo, once. If the hint is already showing they have
       seen it, and eating their click would look like a dead button. */
    if (!S.typoDismissed && !typoBox.classList.contains('is-on')) {
      var fix = suggestEmail(emailInput.value);
      if (fix) {
        e.stopPropagation();
        showTypo(fix);
        S.typoDismissed = true;
        emailInput.focus();
        return;
      }
    }

    S.submitted = true;
    syncHiddenFields();
    track('submit');
    $('usv-submit').disabled = true;
    window.setTimeout(unlock, CFG.UNLOCK_MS);
    /* falls through to Default's listener */
  }
  document.addEventListener('submit', gate, true);

  function boot() {
    S.renderedAt = Date.now();
    track('view');
    if (!ASSET && window.console) console.warn('[Upserve gate] no data-upserve-asset on the page: content_asset will be blank.');
    if (CFG.FORM_ID) form.setAttribute('data-default-form-id', String(CFG.FORM_ID));
    else if (window.console) console.warn('[Upserve gate] CFG.FORM_ID not set: posting to the page’s default Default form.');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}());
</script>
